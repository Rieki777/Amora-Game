# Dependency updates, grouped so a two-person review queue can absorb them.
#
# WHY GROUPS AND NOT THE DEFAULT. Ungrouped, this repository would open roughly
# one pull request per outdated package, and the dependency list carries about
# thirty `@radix-ui/*` packages and nine `@fontsource/*` packages that move as
# families. That is a week where the review queue is entirely dependency bumps
# and a module listing waits behind them. Grouping trades "one bisectable
# change per pull request" for "a queue somebody actually reads", which is the
# right trade at this size and would stop being the right trade with more
# maintainers.
#
# WHY THE COST IS NOT ONLY REVIEW TIME. `.github/workflows/ci.yml` fires on
# push to every branch AND on pull_request, so one Dependabot branch costs two
# CI runs. At the durations this repository currently sees that is over a
# quarter hour of runner time per pull request. On a public repository standard
# runners are free and this is only wall-clock; on a private one it is billed
# minutes.
# Either way, grouping is what keeps a weekly refresh from being the largest
# line in the Actions bill.
#
# MAJORS. The three family groups below take majors too, because a Radix or a
# Fontsource major that arrived as thirty separate pull requests would be worse
# than one that arrives as a single readable diff. Everything else takes only
# minor and patch in a group, so a major on a load-bearing package (express,
# drizzle-orm, vite, react, viem, zod) still arrives on its own and gets read
# on its own. That is deliberate: those are the ones where the release notes
# matter more than the version number.
#
# The audit gate is separate from this file and stays separate. Advisories with
# no upstream fix are documented in `docs/SECURITY_ADVISORIES.md`; nothing here
# suppresses anything.
#
# THE ONE `ignore` ENTRY. Express 5 is held back, and the reason is a boot-time
# crash rather than taste. `path-to-regexp` v8, which Express 5 depends on,
# REMOVED inline regular expressions in route parameters. Two routes here use
# that syntax:
#
#     server/index.ts:9969   app.patch("/api/forum/:kind(threads|replies)/:id", ...)
#     server/index.ts:16268  app.post("/api/admin/call-tasks/:id/:action(accept|dismiss)", ...)
#
# Under Express 5 those throw when the route is REGISTERED, so the server would
# fail to start at all. Dependabot pull request #121 bumped express 4.21.2 to
# 5.2.1 and its CI went red on `pnpm check` with three TS2339 errors, where the
# parameter is typed as the literal key `"kind(threads|replies)"` because the
# name no longer parses out. A typecheck failure was the visible symptom; the
# outage is the real one.
#
# Ignoring the major does NOT hold back the security fix. `express@4.22.2` asks
# for `path-to-regexp: ~0.1.12`, which admits the patched 0.1.13, plus
# `qs: ~6.15.1` and `body-parser: ~1.20.5`. That minor closed all five express
# advisories on 2026-08-31, and it arrives through the `production` group below
# like any other minor.
#
# REMOVE THIS ENTRY when those two routes are rewritten as plain parameters with
# the validation moved into the handler. Then Express 5 is an ordinary major
# that gets read on its own, which is what the paragraph above wants.
version: 2

updates:
  - package-ecosystem: "npm"
    # Dependabot reads `pnpm-lock.yaml` under the `npm` ecosystem. There is one
    # lockfile and one workspace, so one entry covers the repository.
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
    ignore:
      - dependency-name: "express"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/express"
        update-types: ["version-update:semver-major"]
    groups:
      radix:
        patterns:
          - "@radix-ui/*"
      fonts:
        patterns:
          - "@fontsource/*"
      types:
        patterns:
          - "@types/*"
      production:
        dependency-type: "production"
        update-types:
          - "minor"
          - "patch"
      development:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(actions)"
    groups:
      actions:
        patterns:
          - "*"
