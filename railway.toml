# WATCH THE FIRST DEPLOY AFTER THIS LANDS, AND READ ITS BUILD LOG.
#
# A `Dockerfile` now exists at the repo root, and it is not settled whether
# that changes how Railway builds this service. Here is exactly what is known,
# separated into what was measured and what was only read.
#
# MEASURED, 2026-08-31, deployment 0eaaf3fa-30a2-4860-ab00-f77e10ba6fc9 of
# service "Amora Game" in project "Amora Game", environment production, at
# commit 6de6629 with NO Dockerfile in the tree. First lines of its build log:
#
#     scheduling build on Metal builder "builder-bovfov"
#     using build driver nixpacks-v1.41.0
#
# So `builder = "nixpacks"` is live and honoured TODAY. The worry that the
# line had already gone inert is false, and this file is not lying about the
# build that currently runs. (The nixpacks driver generates its own Dockerfile
# internally, which is why the same log later says "load build definition from
# Dockerfile" while no Dockerfile existed in the repo. That line is not
# evidence of root-Dockerfile detection.)
#
# READ, not measured, from Railway's config-as-code reference on the same day:
# "Railway will always build with a Dockerfile if it finds one", and the only
# documented values for `builder` are RAILPACK and DOCKERFILE. Taken at face
# value that means the first build after this lands is the image.
#
# NOT DETERMINED: whether the presence of the file actually overrides the line
# below. The intended experiment was a throwaway service carrying both a
# Dockerfile and this builder setting, read back from its build log. The
# Railway CLI session token expired part way through the investigation, and
# re-authenticating is a browser sign-in that only the account holder can do.
# So the question stands where the previous lane left it, with one worry
# removed and none added.
#
# WHY IT IS SAFE TO FIND OUT BY DEPLOYING. The health check below is the
# reason. Railway's healthchecks reference: it queries the endpoint until it
# gets a 200, and "only then will the new deployment be made active and the
# previous deployment inactive". A first Dockerfile build that fails to build,
# or builds and cannot serve /health, is marked failed and the deployment that
# is already serving keeps serving. The image is also built and booted end to
# end by .github/workflows/release.yml before any of this, so an image that
# cannot start has already been caught somewhere cheaper.
#
# THE START COMMAND BELOW SURVIVES EITHER ANSWER. Railway's start command
# replaces the image's CMD. The Dockerfile sets WORKDIR /app, USER node, and
# ships the bundle at /app/dist/index.js, which is the path the line below
# names and the same relative path nixpacks produces. It also sets
# NODE_ENV=production itself, so the prefix is redundant rather than wrong.
# The one thing an override costs is the tini ENTRYPOINT if Railway replaces
# that too, which would leave production where it already is today: no SIGTERM
# handler, so a deploy waits out the grace period and is SIGKILLed. That is
# the current behaviour, so it is not a regression either way.
#
# WHAT TO DO ON THAT FIRST DEPLOY: read the first two lines of the build log
# (`railway logs --build <deploymentId>`). If they name a driver other than
# nixpacks, the Dockerfile won: set `builder = "DOCKERFILE"` here so the file
# states what actually happens, and delete this comment. If they still say
# nixpacks, the line below won: leave it, and delete this comment too.
[build]
# ANSWERED 2026-08-31, by deploying: THE DOCKERFILE WINS. Adding the file
# switched the builder even with `builder = "nixpacks"` set, exactly as
# Railway's reference says and as this file warned. Build succeeded in 58s;
# the deploy then failed on `Deploy > Create container` with "The executable
# `node_env=production` could not be found". Nixpacks ran startCommand
# through a shell, so the NODE_ENV prefix was an env assignment. Docker runs
# it in exec form with no shell, so it looked for a binary of that name.
# Production never went down: Railway kept the previous deployment serving
# because the new one never passed its healthcheck.
builder = "DOCKERFILE"
buildCommand = "pnpm run build"

[deploy]
# startCommand is DELIBERATELY ABSENT. The image is self-contained: it sets
# ENV NODE_ENV=production and ENV PORT=3000, runs ENTRYPOINT ["/usr/bin/tini",
# "--"] and CMD ["node", "dist/index.js"]. Overriding the start command here
# would not only reintroduce the shell-versus-exec bug above, it would BYPASS
# TINI AS PID 1, and the graceful-shutdown work added on 2026-08-31 depends on
# this process receiving SIGTERM to drain in-flight requests instead of being
# killed with them still open. The image knows how to start itself. Let it.
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3

# The probe. server/index.ts serves /health, and it answers with the build
# marker, so a green health check also says which commit is live.
#
# As of the ops lane's change this is a REAL probe, not a liveness ping: it
# runs SELECT 1 through the live pool and answers 503 with status "degraded"
# when the database is unreachable. So a deploy against a broken database now
# fails instead of going live and serving 500s behind a green light. That is
# the point of pairing it with a timeout that a slow boot can survive.
healthcheckPath = "/health"

# Seconds, and the number comes from two measurements that disagree by 6x.
#
# The server calls listen() LAST. Before it does, boot applies every pending
# migration, loads the token registry, seeds the economy, and walks the ledger
# invariants. MEASURED 2026-08-30, booting the exact production file set
# against a COMPLETELY EMPTY MySQL schema, twice, doing provably identical
# work both times (107 migrations, 7 seed operations, verified by comparing
# the two boot logs):
#
#   228.5 s  against a cold database server
#    37.5 s  against the same server minutes later, caches warm
#
# Both numbers are honest and the spread is the finding. The work does not
# vary; how warm the database is varies, by a factor of six. The number to
# size a timeout against is therefore the cold one, because a container coming
# up on a freshly provisioned instance is exactly the cold case.
#
# 228 seconds already spends three quarters of Railway's 300 second default,
# so the default is not merely tight: it is within about seventy seconds of
# failing the FIRST deploy of every new village, and it would fail outright on
# a slower disk or a database one network hop away. A later deploy applies
# fewer migrations but walks a bigger ledger.
#
# 900 gives roughly four times the cold measurement. It is a ceiling and not a
# wait: a fast boot passes on the first probe. If a deploy ever fails this
# check while the container log still shows migrations running, RAISE THIS
# NUMBER. Do not remove the probe: a village serving 500s behind a green light
# is the failure this pairing exists to prevent.
healthcheckTimeout = 900
